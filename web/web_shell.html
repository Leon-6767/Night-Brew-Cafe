<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1d1716; }
        body { touch-action: none; }
        #canvas { display: block; width: 100vw; height: 100dvh; border: 0; outline: none; }
        #status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
        #status, #status-splash { top: 0; bottom: 0; }
        #status { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1d1716; color: #fff1d4; }
        #status-splash { max-width: 100%; max-height: 100%; margin: auto; }
        #status-splash.show-image--false { display: none; }
        #status-splash.fullsize--true { width: min(40vw, 220px); height: auto; object-fit: contain; }
        #status-splash.use-filter--false { image-rendering: pixelated; }
        #status-progress, #status-notice { display: none; }
        #status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
        #status-notice { background: #5b3943; border-radius: .5rem; border: 1px solid #9b3943; margin: 0 2rem; padding: 1rem; text-align: center; }
    </style>
</head>
<body>
    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
    <noscript>Your browser does not support JavaScript.</noscript>
    <div id="status"><img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.icon.png" alt="Night Brew Cafe"><progress id="status-progress"></progress><div id="status-notice"></div></div>
    <script src="$GODOT_URL"></script>
    <script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
const statusOverlay = document.getElementById('status');
const statusProgress = document.getElementById('status-progress');
const statusNotice = document.getElementById('status-notice');
function setStatusMode(mode) { if (mode === 'hidden') { statusOverlay.remove(); return; } statusOverlay.style.visibility = 'visible'; statusProgress.style.display = mode === 'progress' ? 'block' : 'none'; statusNotice.style.display = mode === 'notice' ? 'block' : 'none'; }
function displayFailureNotice(error) { statusNotice.textContent = error instanceof Error ? error.message : String(error); setStatusMode('notice'); }
setStatusMode('progress');
engine.startGame({ onProgress: (current, total) => { if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; } } }).then(() => setStatusMode('hidden'), displayFailureNotice);
    </script>
</body>
</html>
